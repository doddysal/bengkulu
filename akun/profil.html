<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Pengguna</title><link rel="stylesheet" href="/assets/css/variables.css"><link rel="stylesheet" href="/assets/css/components.css"><link rel="stylesheet" href="/assets/css/public.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header" data-navbar></header><main class="section"><div class="container"><form class="card profile-form" data-profile-form><h1>Profil Pengguna</h1><p class="muted">Atur nama dan avatar yang tampil pada navbar.</p><div class="profile-avatar"><img data-avatar-preview hidden alt="Pratinjau avatar"></div><label class="field">Nama lengkap<input name="nama" required maxlength="100"></label><label class="field">Link avatar Cloudinary<input name="avatar_url" type="url" data-avatar-url placeholder="https://res.cloudinary.com/..."></label><label class="field">Atau pilih gambar<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-avatar-file></label><button class="btn btn-secondary" type="button" data-avatar-upload>Upload ke Cloudinary</button><p class="muted" data-avatar-status aria-live="polite"></p><button class="btn btn-primary" type="submit">Simpan Profil</button><p data-profile-status aria-live="polite"></p></form></div></main><footer class="site-footer" data-footer></footer><script type="module" src="/js/public/navbar.js"></script><script type="module" src="/js/public/footer.js"></script><script type="module" src="/js/public/profil.js"></script></body></html>
